name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/meetingmind-ai/frontend

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Building image..."
            docker build -t meetingmind-frontend .

            echo "==> Replacing container..."
            docker stop meetingmind-frontend 2>/dev/null || true
            docker rm   meetingmind-frontend 2>/dev/null || true

            docker run -d \
              -p 3000:80 \
              -e BACKEND_URL="${{ secrets.BACKEND_URL }}" \
              --name meetingmind-frontend \
              --restart unless-stopped \
              meetingmind-frontend

            echo "==> Deploy complete."
